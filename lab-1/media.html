<!DOCTYPE html>
<html>
<head>
  <title>My Favorite Pictures</title>
  <style>
    #header {
      background-color: dimgray;
      padding: 20px;
      text-align: center;
    }
    #title {
      color: white;
      margin: 0;
    }
    #menu {
      background-color: lightgray;
    }
    #iframe {
      width: 100%;
      height: 40px;
      border: none;
    }
    #content {
      padding: 20px;
      min-height: 550px;
    }

    #tblpictures {
      width: 100%;
      height: 550px;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 5px;
    }
    #tblpictures th,
    #tblpictures td {
      width: 50%;
      height: 25%;
      text-align: center;
      vertical-align: middle;
      padding: 10px;
      box-sizing: border-box;
    }
    #tblpictures img {
      max-width: 100%;
      height: auto;
    }
    #tblpictures video {
      max-width: 100%;
      height: auto;
    }

    #footer {
      background-color: khaki;
      height: 50px;
      line-height: 50px;
      text-align: center;
    }
    #footnote {
      font-weight: bold;
    }
  </style>
</head>
<body>
 
<div id="header">
  <h1 id="title">My Favorite Pictures</h1>
</div>
 
<div id="menu">
  <iframe id="iframe" src="menu.html" title="Menu"></iframe>
</div>
 
<div id="content">
  <table id="tblpictures" border="1" cellpadding="20" cellspacing="5">
    <tr>
      <th>Static</th>
      <th>Animated</th>
    </tr>
    <tr>
      <td align="center">
        <!-- Put your static image here-->
        <img src="h1.jpg" alt="Tanah Suci Makkah, tempat semua umat islam!">
      </td>
      <td align="center">
        <!-- Put your animated GIF here-->
        <img src="67.gif" alt="Description of the animation" width="300" height="200">
      </td>
    </tr>
    <tr>
      <th>Audio</th>
      <th>Video</th>
    </tr>
    <tr>
      <td align="center">
        <!-- Put your audio player here-->
        <audio controls>
          <source src="zikir.mp3" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </td>
      <td align="center">
        <!-- Put your video player here-->
        <video width="640" height="360" controls>
          <source src="video.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </td>
    </tr>
  </table>
</div>
 
<div id="footer">
  <span id="footnote">Web Programming</span>
</div>
 
</body>
</html>
